# ===================================================================
# CodeMate Spring Boot Backend Configuration
# ===================================================================

# Application Information
spring.application.name=codemate-backend

# Server Configuration (Binds to Render PORT or SERVER_PORT or 8080)
server.port=${PORT:${SERVER_PORT:8080}}
server.address=0.0.0.0
server.servlet.context-path=/

# -------------------------------------------------------------------
# PostgreSQL Database Configuration (Supabase / Cloud / Local)
# -------------------------------------------------------------------
# Mandatory environment variables for Supabase PostgreSQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Connection Pool Configuration (Supabase & Cloud-optimized)
spring.datasource.hikari.pool-name=CodeMateHikariPool
spring.datasource.hikari.maximum-pool-size=${SPRING_DATASOURCE_HIKARI_MAX_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${SPRING_DATASOURCE_HIKARI_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000
spring.datasource.hikari.connection-test-query=SELECT 1

# -------------------------------------------------------------------
# JPA / Hibernate Configuration
# -------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# -------------------------------------------------------------------
# CORS Configuration
# -------------------------------------------------------------------
# Configurable frontend origin (e.g. Render Static Site URL)
codemate.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# -------------------------------------------------------------------
# JWT & Security Configuration (Environment-Driven)
# -------------------------------------------------------------------
# Minimum 256-bit secure secret key for HMAC-SHA256 JWT signing
codemate.jwt.secret=${JWT_SECRET:CodeMateSuperSecureJwtSecretKeyMustBeAtLeast256BitsLongForHmacSha256Security}
# Token validity duration in milliseconds (default 24 hours = 86400000 ms)
codemate.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# -------------------------------------------------------------------
# Google Authentication (Spring Security OAuth 2.0 / OpenID Connect)
# -------------------------------------------------------------------
# Official Google Cloud Console OAuth 2.0 Client credentials
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:google-client-id-placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:google-client-secret-placeholder}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI_TEMPLATE:{baseUrl}/login/oauth2/code/{registrationId}}

# -------------------------------------------------------------------
# GitHub Authentication (Spring Security OAuth 2.0)
# -------------------------------------------------------------------
# Official GitHub OAuth App credentials
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:github-client-id-placeholder}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:github-client-secret-placeholder}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI_TEMPLATE:{baseUrl}/login/oauth2/code/{registrationId}}

# CodeMate Frontend URL for OAuth Callback redirection & CORS
codemate.frontend.url=${FRONTEND_URL:http://localhost:3000}
codemate.google.client-id=${GOOGLE_CLIENT_ID:}
codemate.github.client-id=${GITHUB_CLIENT_ID:}

# -------------------------------------------------------------------
# CodeCat AI Companion Configuration (Spring Boot Backend -> AI Provider)
# -------------------------------------------------------------------
gemini.api.key=${AI_API_KEY:${GEMINI_API_KEY:}}
ai.model=${AI_MODEL:gemini-2.5-flash}
ai.base-url=${AI_BASE_URL:https://generativelanguage.googleapis.com}

# Logging configuration
logging.level.com.codemate=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.com.zaxxer.hikari=INFO
