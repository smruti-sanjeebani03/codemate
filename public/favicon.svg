<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <title>CodeMate</title>
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Subtle Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.5" />
    </linearGradient>

    <!-- Left Brace Gradient -->
    <linearGradient id="leftBraceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Center Code Gradient (Blue -> Purple) -->
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <!-- Slash Gradient -->
    <linearGradient id="slashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Right Brace Gradient -->
    <linearGradient id="rightBraceGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
  </defs>

  <!-- Container Squircle Background -->
  <rect
    x="16"
    y="16"
    width="480"
    height="480"
    rx="116"
    fill="url(#bgGrad)"
    stroke="url(#borderGrad)"
    stroke-width="12"
  />

  <!-- Subtle Inner Ambient Glow Behind Glyph -->
  <circle cx="256" cy="256" r="140" fill="#3B82F6" opacity="0.08" />

  <!-- Code Symbol Group { < / > } -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left Curly Brace { -->
    <path
      d="M 112 144 C 84 144, 72 168, 72 208 L 72 230 C 72 248, 62 256, 44 256 C 62 256, 72 264, 72 282 L 72 304 C 72 344, 84 368, 112 368"
      stroke="url(#leftBraceGrad)"
      stroke-width="36"
    />

    <!-- Left Angle Bracket < -->
    <path
      d="M 204 186 L 148 256 L 204 326"
      stroke="url(#codeGrad)"
      stroke-width="36"
    />

    <!-- Center Slash / -->
    <path
      d="M 284 164 L 228 348"
      stroke="url(#slashGrad)"
      stroke-width="36"
    />

    <!-- Right Angle Bracket > -->
    <path
      d="M 308 186 L 364 256 L 308 326"
      stroke="url(#codeGrad)"
      stroke-width="36"
    />

    <!-- Right Curly Brace } -->
    <path
      d="M 400 144 C 428 144, 440 168, 440 208 L 440 230 C 440 248, 450 256, 468 256 C 450 256, 440 264, 440 282 L 440 304 C 440 344, 428 368, 400 368"
      stroke="url(#rightBraceGrad)"
      stroke-width="36"
    />
  </g>
</svg>
